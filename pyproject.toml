[project]
name = "weight-space"
version = "0.1.0"
description = "Gradient-free weight edits that remove thinking loops from small local models, with MLX"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
    "safetensors>=0.8.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "harness/kernel_env",
]
